name: CI

on:
  push:
    branches:
      - main
      - master
      - ETM_telecheck
  pull_request:
    branches:
      - main
      - master
      - ETM_telecheck

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --if-present
      - run: npm test --if-present
      - name: Smoke health (dev server)
        run: |
          nohup npm start &
          sleep 5
          npm run smoke:health

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run gen:sdk

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ auth, ehr, rpm, labs, medications, billing, messaging-admin ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install service deps
        run: |
          cd services/${{ matrix.service }}
          npm ci || npm install
      - name: Unit tests (per service)
        run: |
          cd services/${{ matrix.service }}
          USE_DB=false npx vitest run tests/unit --reporter=dot

  pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:contract

  e2e_mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright (MOCK)
        env:
          VITE_MODE: MOCK
          ENABLE_EXPRESS: "0"
        run: npm run test:e2e

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run sbom
