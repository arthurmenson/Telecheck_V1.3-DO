name: CI

on:
  push:
    branches: [main, master, ETM_telecheck]
  pull_request:
    branches: [main, master, ETM_telecheck]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.14.0"
  NPM_VERSION: "10.8.2"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}
      - name: Verify toolchain
        run: |
          node -v
          npm -v
      - name: Install (frozen)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build --if-present
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit --if-present 2>&1 | tee unit-tests.log
      - name: Smoke health (dev server)
        run: |
          nohup npm start &
          sleep 5
          set -o pipefail
          npm run smoke:health 2>&1 | tee smoke-health.log
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== ENV ==="
          node -v
          npm -v
          echo "=== NPM LS (depth 0) ==="
          npm ls --depth=0 || true
          echo "=== Lockfile checksum ==="
          shasum -a 256 package-lock.json || true

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            unit-tests.log
            smoke-health.log

      - name: Append failure summary
        if: failure()
        run: |
          echo "### CI failure logs (tail)" >> $GITHUB_STEP_SUMMARY
          if [ -f unit-tests.log ]; then echo "\n#### Unit tests" >> $GITHUB_STEP_SUMMARY; tail -n 200 unit-tests.log >> $GITHUB_STEP_SUMMARY; fi
          if [ -f smoke-health.log ]; then echo "\n#### Smoke health" >> $GITHUB_STEP_SUMMARY; tail -n 200 smoke-health.log >> $GITHUB_STEP_SUMMARY; fi

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run gen:sdk

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [auth, ehr, rpm, labs, medications, billing, messaging-admin, erx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}
      - name: Install root (frozen)
        run: npm ci
      - name: Install service deps (frozen)
        run: |
          cd services/${{ matrix.service }}
          npm ci || npm install
      - name: Unit tests (per service)
        run: |
          cd services/${{ matrix.service }}
          USE_DB=false npx vitest run --root . tests/unit --reporter=dot

  pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run test:contract

  e2e_mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright (MOCK)
        env:
          VITE_MODE: MOCK
          ENABLE_EXPRESS: "0"
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            e2e.log
            playwright-report/**
            test-results/**

      - name: Append E2E failure summary
        if: failure()
        run: |
          echo "### E2E failure logs (tail)" >> $GITHUB_STEP_SUMMARY
          if [ -f e2e.log ]; then tail -n 200 e2e.log >> $GITHUB_STEP_SUMMARY; fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run sbom
