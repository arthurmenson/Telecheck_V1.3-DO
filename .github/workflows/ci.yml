name: CI
on:
  pull_request:
    branches: [ main, develop ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test
      - run: npm run test:e2e
      - name: Verify wiring
        run: node scripts/verify-wiring.ts
      - name: OpenAPI breaking change gate (when contracts change)
        run: |
          CHANGED=$(git diff --name-only origin/${GITHUB_BASE_REF:-main}... | grep '^contracts/' || true)
          if [ -n "$CHANGED" ]; then
            npm run check:openapi
          else
            echo "No contracts changes"
          fi
      - name: Ban localhost
        run: "! grep -R 'http://localhost:' -n --include=*.{ts,tsx,js,jsx} || (echo 'localhost found' && exit 1)"
      - name: Enforce adapters (no direct api.service)
        run: "! grep -R 'client/services/api.service' -n client/pages || (echo 'Use feature adapters' && exit 1)"
      - name: Telemetry present on changed features (best-effort)
        run: "git diff --name-only HEAD^ | xargs -I{} grep -R \"track('tc:\" -n {} || true"
      - name: Flags import in adapters (best-effort)
        run: |
          grep -L "from '../flags'" lib/adapters/*.ts || true
