name: Readiness CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint formatting baseline
        run: npm run lint:ci

      - name: Run full test suite
        run: npm run test

      - name: Build client and server bundles
        run: npm run build

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: dist/spa
          if-no-files-found: error

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: dist/server
          if-no-files-found: error

      - name: Validate managed secrets
        run: npm run secrets:check

      - name: Scan dependencies for known vulnerabilities
        run: npm run security:scan
