alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
  - rule: DOMAIN_FAILED
  - rule: DOMAIN_LIVE
ingress:
  rules:
    - component:
        name: telecheck-web
      match:
        path:
          prefix: /
name: whale-app
region: nyc
services:
  - envs:
      - key: VITE_API_URL
        scope: RUN_AND_BUILD_TIME
        value: https://telecheck-api-8jwxq.ondigitalocean.app/api
    github:
      branch: ETM_telecheck
      deploy_on_push: true
      repo: arthurmenson/Telecheck_V1.3-DO
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    name: telecheck-web
