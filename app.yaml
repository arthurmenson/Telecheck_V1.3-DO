name: whale-app
services:
  - name: web
    source_dir: /
    github:
      repo: arthurmenson/Telecheck_V1.3-DO
      branch: ETM_telecheck
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    envs:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://whale-app-bs3xa.ondigitalocean.app
      - key: VITE_API_URL
        value: https://whale-app-bs3xa.ondigitalocean.app/api
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: DB_SSL_CA
        value: ${DB_SSL_CA}
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
    routes:
      - path: /
    health_check:
      http_path: /api/health
databases:
  - name: db
    engine: PG
    version: "15"
    size: db-s-dev-database
