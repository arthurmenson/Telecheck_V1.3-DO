openapi: 3.0.3
info:
  title: Telecheck Billing & Eligibility API
  description: Endpoints for claim generation (837P), claim status, ERA (835) ingestion, and eligibility (270/271)
  version: 1.0.0
  contact:
    name: Telecheck API Team
    email: api@telecheck.health

servers:
  - url: /api
    description: API Gateway base

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    Claim837PRequest:
      type: object
      required: [encounterId]
      properties:
        encounterId:
          type: string
          example: "enc_123"
        billingProvider:
          type: object
          additionalProperties: true
        renderingProvider:
          type: object
          additionalProperties: true
        subscriber:
          type: object
          additionalProperties: true
        payer:
          type: object
          additionalProperties: true
        services:
          type: array
          items:
            type: object
            properties:
              cpt:
                type: string
                example: "99213"
              modifiers:
                type: array
                items:
                  type: string
              charge:
                type: number
                example: 125.0
              units:
                type: number
                example: 1

    Claim837PResponse:
      type: object
      properties:
        claimId:
          type: string
          example: "clm_abc123"
        status:
          type: string
          enum: [generated, submitted, rejected, accepted]
          example: generated
        x12:
          type: string
          description: Base64-encoded 837P payload (optional)

    ClaimStatusResponse:
      type: object
      properties:
        claimId:
          type: string
        status:
          type: string
          enum: [generated, submitted, rejected, accepted, paid, pending]
        clearinghouseId:
          type: string
          nullable: true
        lastUpdate:
          type: string
          format: date-time

    Era835IngestRequest:
      type: object
      properties:
        payload:
          type: string
          description: Base64-encoded 835 ERA content
        metadata:
          type: object
          additionalProperties: true

    Era835IngestResponse:
      type: object
      properties:
        eraId:
          type: string
        status:
          type: string
          enum: [received, parsed, failed]
        message:
          type: string

    Eligibility270Request:
      type: object
      required: [member, payer]
      properties:
        member:
          type: object
          properties:
            id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            dateOfBirth:
              type: string
              format: date
            gender:
              type: string
              example: "M"
        payer:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        serviceType:
          type: string
          description: Optional service type code (e.g., 30 = Health Benefit Plan Coverage)

    Eligibility271Response:
      type: object
      properties:
        eligible:
          type: boolean
        coverageLevel:
          type: string
          example: "individual"
        plan:
          type: string
          example: "PPO"
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        copay:
          type: number
          example: 20
        coinsurance:
          type: number
          example: 0.2

security:
  - BearerAuth: []

paths:
  /billing/claims/837p:
    post:
      summary: Generate 837P professional claim
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Claim837PRequest"
      responses:
        "201":
          description: Claim generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim837PResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /billing/claims/{id}/status:
    get:
      summary: Get status for a claim
      tags: [Billing]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claim status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimStatusResponse"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /billing/era/835:
    post:
      summary: Ingest 835 ERA remittance
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Era835IngestRequest"
      responses:
        "202":
          description: ERA received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Era835IngestResponse"

  /eligibility/check:
    post:
      summary: Perform 270 eligibility check, return 271
      tags: [Eligibility]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Eligibility270Request"
      responses:
        "200":
          description: Eligibility response (271)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eligibility271Response"

tags:
  - name: Billing
    description: Claims and ERA operations
  - name: Eligibility
    description: Real-time eligibility operations
