openapi: 3.0.3
info:
  title: Telecheck API Surface
  version: 1.0.0
servers:
  - url: /api
paths:
  /ehr/scheduling/slots:
    get:
      summary: List available scheduling slots
      operationId: listSchedulingSlots
      parameters:
        - name: providerId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingSlotsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /ehr/scheduling/book:
    post:
      summary: Book a scheduling slot
      operationId: bookSchedulingSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookSchedulingRequest'
      responses:
        '200':
          description: Slot booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Slot already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ehr/scheduling/{appointmentId}/reschedule:
    post:
      summary: Reschedule an appointment
      operationId: rescheduleAppointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: Appointment rescheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /ehr/scheduling/{appointmentId}/cancel:
    post:
      summary: Cancel an appointment
      operationId: cancelAppointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Appointment canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /rpm/patients/{id}/vitals:
    get:
      summary: Get patient vitals for RPM dashboard
      operationId: getRpmPatientVitals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
      responses:
        '200':
          description: Patient vitals summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpmVitalsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /rpm/patients/{id}/alerts:
    get:
      summary: Get patient RPM alerts
      operationId: getRpmPatientAlerts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpmAlertsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /rpm/patients/{id}/thresholds:
    get:
      summary: Get RPM thresholds for patient
      operationId: getRpmPatientThresholds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient thresholds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpmThresholdsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
components:
  schemas:
    SchedulingSlot:
      type: object
      properties:
        id:
          type: string
        providerId:
          type: string
        locationId:
          type: string
          nullable: true
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          type: string
          enum: [available, booked, held, cancelled]
      required:
        - id
        - providerId
        - start
        - end
        - status
    SchedulingSlotsResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingSlot'
      required:
        - slots
    BookSchedulingRequest:
      type: object
      properties:
        slotId:
          type: string
        patientId:
          type: string
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required:
        - slotId
        - patientId
    BookingResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [booked, rescheduled]
        slot:
          $ref: '#/components/schemas/SchedulingSlot'
      required:
        - id
        - status
        - slot
    RescheduleRequest:
      type: object
      properties:
        to:
          type: string
          format: date-time
      required:
        - to
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
      additionalProperties: false
    CancelResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [canceled]
      required:
        - id
        - status
    VitalSample:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
        metadata:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - timestamp
        - value
    VitalSeries:
      type: object
      properties:
        metric:
          type: string
        unit:
          type: string
          nullable: true
        values:
          type: array
          items:
            $ref: '#/components/schemas/VitalSample'
      required:
        - metric
        - values
    RpmVitalsResponse:
      type: object
      properties:
        patientId:
          type: string
        days:
          type: integer
        vitals:
          type: array
          items:
            $ref: '#/components/schemas/VitalSeries'
        summary:
          type: object
          properties:
            totalRecords:
              type: integer
            metrics:
              type: array
              items:
                type: object
                properties:
                  metric:
                    type: string
                  count:
                    type: integer
                required:
                  - metric
                  - count
          required:
            - totalRecords
            - metrics
      required:
        - patientId
        - days
        - vitals
        - summary
    AlertRecord:
      type: object
      properties:
        id:
          type: string
        metric:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, acknowledged, resolved]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        context:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - id
        - metric
        - severity
        - status
        - message
        - createdAt
    RpmAlertsResponse:
      type: object
      properties:
        patientId:
          type: string
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertRecord'
      required:
        - patientId
        - alerts
    ThresholdRecord:
      type: object
      properties:
        metric:
          type: string
        unit:
          type: string
          nullable: true
        minValue:
          type: number
          nullable: true
        maxValue:
          type: number
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - metric
        - updatedAt
    RpmThresholdsResponse:
      type: object
      properties:
        patientId:
          type: string
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdRecord'
      required:
        - patientId
        - thresholds
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - error
        - code
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
