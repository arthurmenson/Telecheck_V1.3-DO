alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
  - rule: DOMAIN_FAILED
  - rule: DOMAIN_LIVE
ingress:
  rules:
    - component:
        name: telecheck-api
      cors:
        allow_credentials: true
        allow_headers:
          - Content-Type
          - Authorization
          - X-Requested-With
        allow_methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allow_origins:
          - exact: https://whale-app-bs3xa
          - exact: https://telecheck
        max_age: 3600s
      match:
        path:
          prefix: /
name: telecheck-api
region: nyc
services:
  - envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_AND_BUILD_TIME
