ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /
name: telecheck-api
region: nyc
services:
  - environment_slug: node-js
    envs:
      - key: ENABLE_KEYCLOAK_NATIVE_AUTH
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: ENABLE_LEGACY_JWT_AUTH
        scope: RUN_AND_BUILD_TIME
        value: "false"
      - key: OAUTH_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: KEYCLOAK_REALM
        scope: RUN_AND_BUILD_TIME
        value: telecheck
      - key: KEYCLOAK_AUTH_SERVER_URL
        scope: RUN_AND_BUILD_TIME
        value: https://auth.telecheck.health
      - key: KEYCLOAK_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: telecheck-web
      - key: KEYCLOAK_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        value: "public-client-no-secret"
      - key: KEYCLOAK_ADMIN_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: telecheck-api
      - key: KEYCLOAK_ADMIN_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: EV[1:et6DmoJioGu4i9nfB26zp6ApIbKu4+aq:FPRwO/fea/EmxuV7nW9idv3qX35znprWsZ+MIRQCGapPeeSms2fylwH+UUOgdeqknVfpfA==]
      - key: KEYCLOAK_CALLBACK_URL
        scope: RUN_AND_BUILD_TIME
        value: https://whale-app-bs3xa.ondigitalocean.app/api/auth/keycloak/callback
      - key: KEYCLOAK_TOKEN_LIFESPAN
        scope: RUN_AND_BUILD_TIME
        value: "900"
      - key: KEYCLOAK_REFRESH_TOKEN_LIFESPAN
        scope: RUN_AND_BUILD_TIME
        value: "1800"
      - key: KEYCLOAK_SYNC_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: KEYCLOAK_SYNC_BIDIRECTIONAL
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: KEYCLOAK_SYNC_CRON
        scope: RUN_AND_BUILD_TIME
        value: "*/15 * * * *"
    github:
      branch: fix-test-accounts-schema
      deploy_on_push: true
      repo: arthurmenson/Telecheck_V1.3-DO
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    name: api
