spec:
  name: telecheck-prod
  region: nyc
  services:
    - name: web
      source_dir: .
      environment_slug: node-js
      instance_size_slug: basic-xs
      instance_count: 2
      http_port: 8080
      build_command: npm ci && npm run build:prod
      run_command: node dist/server/node-build.mjs
      routes:
        - path: /
      envs:
        - key: NODE_ENV
          value: production
          scope: RUN_TIME
        - key: PORT
          value: "8080"
          scope: RUN_TIME
        - key: JWT_SECRET
          scope: RUN_TIME
          type: SECRET
        - key: DATABASE_URL
          scope: RUN_TIME
          type: SECRET
        - key: REDIS_URL
          scope: RUN_TIME
          type: GENERAL
        - key: VITE_API_URL
          value: /api
          scope: BUILD_TIME
        - key: VITE_API_TIMEOUT
          value: "30000"
          scope: BUILD_TIME
