# DigitalOcean App Platform Configuration for Telecheck V2.0
# This file configures the whale-app deployment

name: whale-app
region: nyc

# API Service (must be listed FIRST for routing priority)
services:
  - name: telecheck-api
    github:
      repo: arthurmenson/Telecheck_V1.3-DO
      branch: ETM_telecheck
      deploy_on_push: true

    # Use DigitalOcean buildpacks (automatic detection) - more reliable
    # dockerfile_path: Dockerfile.server

    instance_count: 2
    instance_size_slug: professional-xs

    http_port: 3000

    health_check:
      http_path: /api/ping
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 30
      success_threshold: 1
      failure_threshold: 5

    routes:
      - path: /api
      - path: /health

    # Use subdomain for API service (recommended for production)
    domains:
      - domain: api.whale-app-bs3xa.ondigitalocean.app
        type: PRIMARY

    envs:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: "info"
      # Database - Use DigitalOcean managed database
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      # Redis - Use DigitalOcean managed Redis
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      # JWT Secret
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      # OAuth Configuration
      - key: OAUTH_ENABLED
        value: "true"
      - key: OAUTH_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CALLBACK_URL
        value: "${APP_URL}/api/auth/google/callback"
      # Keycloak SSO
      - key: KEYCLOAK_URL
        value: "${APP_URL}/auth"
      - key: KEYCLOAK_REALM
        value: "telecheck"
      - key: KEYCLOAK_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: KEYCLOAK_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: KEYCLOAK_AUTH_SERVER_URL
        scope: RUN_TIME
        type: SECRET
      - key: KEYCLOAK_CALLBACK_URL
        value: "${APP_URL}/api/auth/keycloak/callback"
      # Vault
      - key: VAULT_ADDR
        scope: RUN_TIME
        type: SECRET
      - key: VAULT_TOKEN
        scope: RUN_TIME
        type: SECRET
      # PHI Encryption Keys
      - key: PHI_PATIENT_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PHI_MEDICAL_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PHI_FINANCIAL_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PHI_COMMUNICATION_KEY
        scope: RUN_TIME
        type: SECRET
      # HCW@Home Televisit Integration (Native Mediasoup WebRTC)
      # Updated to new deployment: hcw-video-production (Oct 26, 2025)
      - key: HCW_API_URL
        value: "http://143.198.2.224:1337"
      - key: HCW_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: HCW_PATIENT_URL
        value: "http://143.198.2.224:4200"
      - key: HCW_DOCTOR_URL
        value: "http://143.198.2.224:4201"
      # Messaging Services (SMS only - NO Video)
      - key: TELNYX_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Email
      - key: SENDGRID_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        value: "noreply@telecheck.com"
      # Payment Processing
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PUBLISHABLE_KEY
        scope: RUN_TIME
        type: SECRET
      # Feature Flags
      - key: ALLOW_DB_FAILURE
        value: "true"

  # Web Client Service
  - name: telecheck-web
    github:
      repo: arthurmenson/Telecheck_V1.3-DO
      branch: ETM_telecheck
      deploy_on_push: true

    # Use DigitalOcean buildpacks (automatic detection) - more reliable
    # dockerfile_path: Dockerfile.client

    instance_count: 1
    instance_size_slug: basic-xxs

    http_port: 80

    routes:
      - path: /

    envs:
      - key: VITE_API_URL
        value: "https://api.whale-app-bs3xa.ondigitalocean.app/api"

# Managed Databases - Using existing DigitalOcean managed databases
# Note: Database cluster names cannot be changed after creation
# Connect to existing databases using DATABASE_URL and REDIS_URL environment variables

# Alerts
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
  - rule: DOMAIN_FAILED
  - rule: DOMAIN_LIVE
