# DigitalOcean App Platform Configuration for Telecheck V2.0
# This file configures the whale-app deployment (Web Client ONLY)
# API service is now deployed separately at: telecheck-api app

name: whale-app
region: nyc

# Web Client Service (Static Frontend)
services:
  - name: telecheck-web
    github:
      repo: arthurmenson/Telecheck_V1.3-DO
      branch: ETM_telecheck
      deploy_on_push: true

    # Use DigitalOcean buildpacks (automatic detection) - more reliable
    # dockerfile_path: Dockerfile.client

    instance_count: 1
    instance_size_slug: basic-xxs

    http_port: 80

    routes:
      - path: /

    envs:
      - key: VITE_API_URL
        value: "https://telecheck-api-8jwxq.ondigitalocean.app/api"

# Managed Databases - Using existing DigitalOcean managed databases
# Note: Database cluster names cannot be changed after creation
# Connect to existing databases using DATABASE_URL and REDIS_URL environment variables

# Alerts
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
  - rule: DOMAIN_FAILED
  - rule: DOMAIN_LIVE
